<script>
window.SupportFlowDiagnosticFlows = (() => {
  'use strict';
  const option=(label,next,extra={})=>({label,next,...extra});
  const step=(title,instruction,guides,choices,unknown='collect')=>({title,instruction,guides,choices:[...choices,option('Não consegui verificar',unknown,{pending:true,noEvidence:true})]});
  const end=(title,recommendation,guides)=>({title,recommendation,guides});
  const symptoms=[
    {id:'open',title:'Aplicação não abre',description:'Endereço indisponível ou falha ao acessar.',start:'network'},
    {id:'blank',title:'Tela em branco ou travada',description:'A página abre, mas não carrega ou não responde.',start:'console'},
    {id:'access',title:'Problema de login ou permissão',description:'Acesso negado, sessão ou autenticação.',start:'access'},
    {id:'request',title:'Erro ao consultar ou salvar',description:'Falha ao executar uma ação na tela.',start:'network'},
    {id:'slow',title:'Lentidão ou timeout',description:'Operação demora ou fica carregando.',start:'timing'},
    {id:'update',title:'Problema após atualização',description:'Validar pacote, ambiente e objetos antes de retestar.',start:'update'},
    {id:'environment',title:'Conferir ambiente e PROPATH',description:'Versões, instância, caminhos e ordem de busca.',start:'server'},
    {id:'objects',title:'Programa ausente ou objeto antigo',description:'Localização, duplicidades e objetos da correção.',start:'server'},
    {id:'compare',title:'Funciona em outro ambiente',description:'Comparar versões, configurações e customizações.',start:'compare'},
    {id:'custom',title:'Possível customização ou UPC',description:'Investigar adaptações com comparação autorizada.',start:'server'},
    {id:'logs',title:'Solicitar e analisar logs',description:'Obter o arquivo correto e registrar a análise.',start:'requestLog'}
  ];
  const nodes={
    network:step('Confira a chamada no Network','Abra F12 → Network antes de reproduzir o problema. Faça um teste autorizado e selecione a chamada relacionada à ação. Anote método, endereço revisado, status e horário com fuso. Se a ação grava dados, confira se já foi concluída antes de repetir. Qual foi o resultado?', ['KB-0003','KB-0008'],[
      option('Nenhuma chamada foi enviada','console'),option('401 ou 403 — acesso negado','access'),option('404 — recurso não encontrado','endpoint'),option('500 a 599 — erro de servidor','server'),option('Pending, demora ou timeout','timing'),option('200 a 299, mas a tela continua com problema','response'),option('Bloqueio, certificado, CORS ou Mixed Content','security'),option('Outro status ou resultado','response')]),
    console:step('Observe a mensagem do Console','Abra F12 → Console e registre a mensagem apresentada ao reproduzir o problema. Separe mensagens antigas das geradas durante o teste. O que aparece?', ['KB-0001','KB-0002'],[
      option('CORS, Mixed Content ou certificado','security'),option('Erro JavaScript ou componente não carregado','frontend'),option('Nenhum erro relacionado ou nenhuma mensagem','private')]),
    private:step('Compare em uma janela anônima','Abra o endereço correto em janela anônima e autentique-se, se necessário. Compare a mesma ação e o mesmo usuário. Não repita uma gravação sem conferir o resultado anterior. O problema permanece?', ['KB-0005','KB-0006'],[
      option('Não ocorre na janela anônima','browserEnd'),option('Permanece também na janela anônima','network')]),
    access:step('Identifique o alcance do problema de acesso','Confirme ambiente, conta utilizada e mensagem apresentada. Compare com uma conta que já tenha acesso autorizado, sem compartilhar senhas nem ampliar permissões apenas para testar. Quem é afetado?', ['KB-0010','KB-0020'],[
      option('Apenas um usuário ou perfil','permissionEnd'),option('Todos os usuários testados','auth'),option('A sessão expira ou o login é solicitado novamente','auth')]),
    auth:step('Confira o ambiente e a autenticação','Verifique se página e API apontam para o ambiente esperado e se a autenticação exigida está sendo utilizada. Em teste no Postman, siga a configuração prevista para o endpoint; para o exemplo do guia, Basic Auth usa login e senha do ambiente da URL. Não registre credenciais. O que foi confirmado?', ['KB-0010','KB-0011','KB-0012'],[
      option('Endereço, ambiente ou autenticação divergente','authEnd'),option('Configuração esperada, mas o acesso continua negado','accessEnd')]),
    endpoint:step('Confirme a URL que retornou 404','Compare host, porta, contexto da aplicação e caminho da API com o ambiente esperado. Registre a URL sem tokens ou dados sensíveis. O endereço está correto?', ['KB-0011','KB-0007'],[
      option('Foi encontrada uma diferença no endereço','urlEnd'),option('Endereço confirmado, mas o recurso continua ausente','deploymentEnd')]),
    response:step('Confira Response e Payload','Na chamada relacionada ao teste, confira Response e, quando houver, Payload. Um status 2xx não garante sucesso funcional. Revise os dados antes de registrar evidências. O que a resposta mostra?', ['KB-0009','KB-0008'],[
      option('Mensagem de validação ou regra de negócio','businessEnd'),option('Conteúdo esperado, mas a tela não apresenta corretamente','frontend'),option('Resposta vazia, inesperada ou erro não identificado','server')]),
    server:step('Confira Informações do Ambiente','No Datasul afetado, abra Informações do Ambiente (html.environmentInf). Registre release/patch, versão e ambiente. Confirme qual instância PASOE das aplica??es web executa a aplicação web; uma sessão local pode usar outros caminhos. Peça ao responsável os dados que não estiverem disponíveis. O ambiente consultado corresponde ao teste?', ['KB-0016','KB-0017','KB-0015'],[
      option('Ambiente e versões identificados na instância correta','packageCheck'),option('Foi encontrada divergência de ambiente ou versão','environmentEnd'),option('Ainda faltam informações; vou registrar a pendência','packageCheck',{pending:true})],'packageCheck'),
    timing:step('Observe onde o tempo se concentra','No Network, abra Timing da chamada lenta. Registre duração, status final e horário com fuso. Se houve timeout ao salvar, confira se a gravação ocorreu antes de repetir. Qual etapa se destaca?', ['KB-0025','KB-0003'],[
      option('Waiting / TTFB — aguardando começar a resposta','waiting'),option('Download — recebendo a resposta','downloadEnd'),option('Pending ou conexão ainda sem resposta','pendingEnd'),option('Requisição rápida, mas a tela continua lenta','frontend')]),
    waiting:step('Compare o alcance da lentidão','Com o responsável pelo ambiente, verifique se a lentidão também ocorre em outros programas e usuários. Faça apenas testes autorizados. Waiting/TTFB elevado não prova que o tempo foi gasto no banco ou no programa. Qual foi o alcance observado?', ['KB-0025','KB-0028','KB-0027'],[
      option('Uma rotina específica','server'),option('Várias rotinas ou usuários','slowScope')]),
    security:step('Registre o bloqueio do navegador','Capture a mensagem completa, a URL da página e o destino da chamada, revisando dados sensíveis. Não ignore certificados nem desabilite a segurança do navegador. Funcionar no Postman não comprova que a chamada é permitida no navegador. Qual mensagem aparece?', ['KB-0026','KB-0002'],[
      option('CORS','corsEnd'),option('Mixed Content / conteúdo misto','mixedEnd'),option('Certificado, TLS ou SSL','certificateEnd')]),
    frontend:step('Compare Console, arquivos e versão','Registre o erro do Console e, no Network, confira se arquivos JS/CSS ou componentes falharam. Anote a versão e se o problema também ocorre em janela anônima. Qual evidência foi observada?', ['KB-0002','KB-0007','KB-0017'],[
      option('Arquivo ou componente retornou 404','deploymentEnd'),option('Erro JavaScript com arquivos carregados','frontendEnd'),option('Sem erro claro ou com resposta inesperada','collect')]),
    update:step('Confira a correção aplicada','Confirme o pacote oficial do ticket, release/patch, pré-requisitos e todos os componentes previstos: WAR, objetos Progress e dependências, quando aplicável. Solicite confirmação de data, diretórios e servidores/instâncias atualizados. Confira reciclagem de sessões somente se exigida pela orientação e executada pelo responsável. Não substitua arquivos nem reinicie serviços por tentativa.', ['KB-0024','KB-0022','KB-0017'],[
      option('Pacote, versão ou instância divergente','updateEnd'),option('Publicação com falha ou recurso ausente','deploymentEnd'),option('Aplicação conferida; preciso validar o ambiente e os objetos','server')],'server'),
    compare:step('Compare o ambiente que funciona com o afetado','Obtenha Informações do Ambiente dos dois lados e compare release/patch, versão, URL/instância, pacote, objetos e customizações. Use o mesmo cenário e dados de teste autorizados. Não atribua a diferença apenas à versão sem conferir os demais itens.', ['KB-0016','KB-0017','KB-0019'],[
      option('Identifiquei diferenças; vou conferir a instância afetada','server'),option('Dados iniciais equivalentes; preciso aprofundar a análise','server')],'server'),
    packageCheck:step('Valide pacote e componentes envolvidos','Se existe correção para o cenário, compare as instruções do ticket com o que foi aplicado, incluindo pré-requisitos, WAR e objetos Progress. Registre identificação do pacote, data, diretórios e instâncias confirmados pelo responsável. Data de arquivo sozinha não comprova versão. Se não há pacote indicado, registre isso sem assumir que todos os componentes estão atualizados.', ['KB-0022','KB-0024','KB-0017'],[
      option('Pacote e componentes conferidos','propath'),option('Aplicação incompleta, incompatível ou em instância diferente','updateEnd'),option('Não há pacote indicado para este cenário','propath',{notApplicable:true})],'propath'),
    propath:step('Valide o PROPATH da aplicação web','Em Informações do Ambiente, localize o PROPATH do AppServer que atende a aplicação. Registre a ordem dos diretórios. Na busca de arquivos/programas, pesquise cada caminho relativo indicado na correção ou no erro, por exemplo pasta/programa.r. Compare o local retornado com o diretório atualizado. Não altere o PROPATH nem mova objetos por conta própria.', ['KB-0015','KB-0016','KB-0018'],[
      option('PROPATH e ordem conferidos na instância correta','objectsCheck'),option('Outro diretório tem precedência ou o caminho está divergente','pathEnd'),option('Não há objetos Progress envolvidos — justificativa registrada','customCheck',{notApplicable:true})],'customCheck'),
    objectsCheck:step('Compare os objetos encontrados com a correção','Registre o caminho retornado na busca, data e tamanho de cada objeto. Peça comparação de hash ao responsável quando disponível. Verifique duplicidades em diretórios anteriores do PROPATH e diferenças entre servidores/agentes. Arquivo correto em disco não comprova qual código já está carregado na sessão.', ['KB-0018','KB-0015','KB-0022'],[
      option('Objetos esperados localizados e comparados','customCheck'),option('Há objeto antigo, diferente ou duplicado com precedência','objectsEnd'),option('O objeto esperado não foi localizado','objectMissingEnd')],'customCheck'),
    customCheck:step('Verifique customizações e UPCs','Pergunte por UPCs, integrações e programas específicos relacionados. Registre nomes e caminhos. Se viável, solicite comparação controlada em homologação com e sem a adaptação, pelo responsável e com retorno previsto. Nunca desabilite UPC em produção. O que foi confirmado?', ['KB-0019','KB-0015'],[
      option('Não há customização relacionada, conforme verificação','requestLog'),option('O problema também ocorre no teste sem customização','requestLog'),option('A falha aparece apenas com a customização','customEnd'),option('Não foi possível isolar; vou manter essa hipótese em aberto','requestLog',{pending:true})],'requestLog'),
    slowScope:step('Registre o impacto no ambiente','Se várias rotinas ou usuários estiverem afetados, acione o responsável pelo ambiente conforme a urgência, sem aguardar concluir todo o roteiro. Registre abrangência, horários e Timing. Em paralelo, solicite os logs da instância correta; não reinicie serviços nem aumente limites por tentativa.', ['KB-0025','KB-0028'],[option('Impacto registrado; continuar coleta de logs','requestLog'),option('Não foi possível coletar; registrar impedimento para o responsável','logUnavailableEnd',{pending:true})],'requestLog'),
    requestLog:step('Solicite o log correto ao cliente','Solicite ao responsável o log do agente PASOE das aplica??es web que atende a URL e a instância do teste, ou a camada pertinente ao erro. Combine uma reprodução segura e registre horário exato com fuso, programa, ação e endpoint/status. Peça o arquivo ou trecho autorizado de alguns minutos antes e depois, mantendo a sequência. Em ambiente com vários agentes/servidores, confirme quais participaram. Não solicite aumento de nível ou reinício sem avaliação da equipe responsável.', ['KB-0013','KB-0023','KB-0027'],[
      option('Recebi o log da instância e do intervalo corretos','analyzeLog'),option('Recebi log incompleto, de outra instância ou sem o intervalo','logScope'),option('Ainda preciso solicitar ou aguardo o arquivo do cliente','logAwaitEnd',{pending:true}),option('Não tenho acesso ou existe impedimento de coleta','logUnavailableEnd',{pending:true})],'logAwaitEnd'),
    logScope:step('Complete a coleta antes de interpretar','Confira servidor/agente, instância, data, intervalo e fuso do arquivo recebido. Peça complementação ao cliente quando não cobrir o teste. Um arquivo grande ou um erro próximo no horário não garantem que o log pertença à operação. Não conclua ausência de falha usando o arquivo errado.', ['KB-0013','KB-0027'],[
      option('Recebi a complementação e confirmei o escopo','analyzeLog'),option('Ainda falta o arquivo correto ou o intervalo necessário','logAwaitEnd',{pending:true})],'logAwaitEnd'),
    analyzeLog:step('Analise o log e registre os achados','Abra o Analisador de logs pelo botão abaixo ou utilize um editor local aprovado. Informe o programa, analise o arquivo e confira os contextos no horário do teste, considerando o fuso. Leia mensagem/código, programa e sessão/agente; a detecção automática é apenas um auxílio. Ignore leituras de propriedades e chamadas normais de rastreamento. Registre nas observações o trecho/linhas revisadas, horário e o que encontrou, sem dados sensíveis.', ['KB-0013','KB-0014','KB-0027'],[
      option('Localizei erros e registrei a mensagem/código e o contexto','logCorrelation'),option('Revisei o intervalo e não encontrei erro relacionado','logCoverage'),option('Encontrei apenas avisos ou rastreamento normal','logCoverage'),option('Ainda não analisei o log recebido','logNotReviewedEnd',{pending:true,noEvidence:true}),option('Não consegui analisar; registrei o impedimento','logNotReviewedEnd',{pending:true})],'logNotReviewedEnd'),
    logCorrelation:step('Confirme se o erro pertence ao teste','Compare a mensagem com programa, sequência da ação, instância, sessão/agente e identificador de requisição, quando disponível. Normalize os fusos para comparar os horários. Descreva como confirmou ou por que não conseguiu relacionar o erro; horário próximo sozinho não comprova a correlação.', ['KB-0027','KB-0014'],[
      option('Consegui relacionar o erro à operação testada','logInterpret'),option('Há erros, mas não consegui confirmar relação com o teste','correlationEnd',{pending:true})],'correlationEnd'),
    logInterpret:step('Classifique a evidência encontrada','Pesquise a mensagem completa e o código na base interna/documentação oficial. Não conclua pela ocorrência isolada. Registre nome do programa e linhas próximas. Que evidência direciona a próxima verificação?', ['KB-0014','KB-0015','KB-0018'],[
      option('Programa ausente, caminho incorreto ou objeto antigo','loggedObject'),option('Erro relacionado a customização ou UPC','customEnd'),option('Outro erro ABL, execução ou comunicação com evidência registrada','supportReview')],'supportReview'),
    loggedObject:step('Confira o objeto indicado no erro','Use o caminho relativo da mensagem em Informações do Ambiente e confira PROPATH, precedência, busca do arquivo e pacote aplicado na instância da aplicação web. Não basta encontrar o arquivo no computador do usuário. Registre a localização e a comparação com a correção.', ['KB-0015','KB-0018','KB-0022'],[
      option('Objeto ausente, diferente ou com precedência incorreta','objectsEnd'),option('Objeto e caminho conferidos; erro persiste','supportReview')],'supportReview'),
    logCoverage:step('Confira se a ausência de erro é conclusiva','Confirme instância, agentes, intervalo e fuso. Leia também o arquivo no editor aprovado, pois o analisador não reconhece todos os padrões. Sem registro útil, peça à equipe responsável avaliação do nível/tipos de log e de uma coleta complementar, conforme o cenário; não altere parâmetros nem reinicie por conta própria. O que foi validado?', ['KB-0013','KB-0027'],[
      option('Escopo e leitura manual conferidos; não há erro relacionado visível','supportReview'),option('Preciso completar a coleta ou validar detalhamento com o responsável','logAwaitEnd',{pending:true})],'logAwaitEnd'),
    supportReview:step('Revise os resultados da investigação','Confira as verificações registradas e o que ainda falta esclarecer. Relacione cenário, esperado/observado, ambiente/instância, pacote/PROPATH quando aplicáveis e os achados do log: mensagem/linhas, correlação ou ausência de erro após revisão. Identifique o que as evidências permitem concluir e quais testes ainda são necessários. Se houver impedimento, registre o motivo e a próxima ação possível.', ['KB-0021','KB-0023','KB-0027'],[
      option('Revisei os resultados; organizar o resumo da investigação','serverEnd'),option('Há pendências de coleta que preciso resolver','collect',{pending:true}),option('Existe impedimento ou urgência; registrei a justificativa','supportBlockedEnd',{pending:true})],'collect'),
    environmentEnd:end('Regularizar a identificação do ambiente','Registre a divergência de instância/versão e peça validação ao responsável. O pacote e o log devem corresponder ao ambiente realmente testado.', ['KB-0016','KB-0017']),
    pathEnd:end('Revisar precedência e caminhos com o responsável','Registre PROPATH e ordem, busca do objeto e diretório do pacote. Peça revisão ao responsável, sem alterar caminhos por tentativa. Reteste após a regularização autorizada.', ['KB-0015','KB-0022']),
    objectsEnd:end('Revisar os objetos com o responsável','Documente o objeto, localização retornada, comparação com o pacote e duplicidades. Solicite revisão da aplicação/precedência. Não copie, apague ou substitua arquivos por conta própria.', ['KB-0018','KB-0015','KB-0022']),
    objectMissingEnd:end('Confirmar a disponibilidade do objeto','Registre caminho relativo pesquisado e PROPATH da instância correta. Peça ao responsável validação do pacote, diretórios acessíveis e objetos esperados.', ['KB-0015','KB-0018']),
    customEnd:end('Investigar a customização com as evidências disponíveis','Documente o programa/UPC e a evidência do log ou comparação controlada. Sem comparação autorizada, a hipótese permanece aberta. Encaminhe ao responsável pela adaptação sem desabilitar UPCs em produção.', ['KB-0019','KB-0014']),
    logAwaitEnd:end('Coleta de log pendente','Solicite ou complete o arquivo antes de concluir a análise. Registre o que foi pedido, instância, horário/fuso e o que falta. Não apresente um log não recebido como analisado.', ['KB-0013','KB-0023']),
    logUnavailableEnd:end('Registrar impedimento de coleta','Descreva por que o arquivo não está acessível e quem pode fornecê-lo. Acione infraestrutura/Cloud ou equipe responsável conforme contrato e urgência. A falta de log é uma pendência explícita, não evidência de ausência de erro.', ['KB-0013','KB-0023']),
    logNotReviewedEnd:end('Análise do log pendente','O recebimento do arquivo não substitui a leitura. Utilize o analisador/editor aprovado, confira o intervalo do teste e registre os achados. Se houver impedimento, descreva-o para a equipe responsável.', ['KB-0013','KB-0014']),
    supportBlockedEnd:end('Registre os impedimentos e os próximos passos','Registre as evidências disponíveis, pendências, motivo e quem pode complementar a coleta. Em caso de indisponibilidade, combine as próximas ações com o responsável pelo ambiente conforme o impacto. Não apresente verificações não realizadas como concluídas.', ['KB-0021','KB-0023']),
    collect:end('Faltam evidências para direcionar','Reúna o passo a passo, programa, ambiente, horário com fuso, resultado esperado e observado. Complemente com Network, Console e logs da instância correta conforme o sintoma. Registre o que ainda não pôde ser verificado.', ['KB-0016','KB-0021','KB-0023']),
    browserEnd:end('Diferença entre sessões do navegador','O teste sugere influência da sessão, cache ou dados locais, sem confirmar a causa. Registre a comparação e siga o guia de limpeza somente após avaliar o impacto de encerrar a sessão.', ['KB-0005','KB-0006']),
    permissionEnd:end('Revisar conta e permissões','Encaminhe a comparação ao responsável por acessos, identificando programa e perfil afetados. Não conceda acesso adicional apenas para contornar o erro.', ['KB-0020','KB-0010']),
    authEnd:end('Revisar divergência de ambiente ou autenticação','Registre a divergência sem credenciais e peça validação ao responsável. Depois da orientação aplicada, reteste a mesma ação de forma autorizada.', ['KB-0010','KB-0011','KB-0012']),
    accessEnd:end('Investigar a recusa de acesso','Reúna status, mensagem, ambiente e alcance por usuário. Solicite verificação de sessão/autenticação e logs correlacionados ao responsável pela aplicação ou ambiente.', ['KB-0010','KB-0027']),
    urlEnd:end('Validar o endereço correto','Documente a diferença de host, porta, contexto ou caminho e confirme a URL com o responsável. Reteste somente após validação; não altere configurações do ambiente por tentativa.', ['KB-0011']),
    deploymentEnd:end('Verificar publicação e disponibilidade do recurso','Encaminhe URL/status, recurso ausente, versão e instância ao responsável pela publicação. Confirme nos logs se o projeto foi disponibilizado. Um 404 sozinho não comprova que é necessário reaplicar o WAR.', ['KB-0007','KB-0024','KB-0017']),
    businessEnd:end('Investigar a validação funcional','Registre a mensagem completa, entradas revisadas, resultado esperado e regra que se deseja validar. Encaminhe para análise funcional; não trate apenas o HTTP como confirmação de sucesso.', ['KB-0009','KB-0021']),
    serverEnd:end('Consolide os resultados da investigação','Relacione os testes realizados aos resultados observados e destaque o que foi identificado e o que permanece em aberto. Inclua mensagem/código e contexto correlacionado, ou documente que não foi localizado erro após conferir o escopo e ler o intervalo. Use as evidências para definir o próximo teste ou validar a orientação com o cliente; a revisão do roteiro não certifica automaticamente que a investigação está completa.', ['KB-0013','KB-0014','KB-0027']),
    correlationEnd:end('Completar a correlação com o servidor','Confira instância, intervalo, fuso e identificador, quando disponível. Não associe uma exceção ao teste somente porque ocorreu em horário próximo.', ['KB-0027','KB-0028']),
    downloadEnd:end('Investigar a transferência da resposta','Reúna Timing, duração e tamanho da resposta, comparando redes ou usuários apenas com autorização. Tempo de download elevado não identifica sozinho a origem do problema.', ['KB-0025']),
    pendingEnd:end('Investigar a chamada pendente','Registre o tempo observado e eventual resultado final, sem repetir sucessivamente a operação. Peça ao responsável que confira comunicação e logs no mesmo horário.', ['KB-0025','KB-0027','KB-0028']),
    corsEnd:end('Solicitar análise de CORS','Encaminhe origem da página, destino da chamada e mensagem do navegador ao responsável pela configuração da comunicação. Não utilize extensões para liberar CORS.', ['KB-0026']),
    mixedEnd:end('Solicitar análise de conteúdo misto','Registre a página HTTPS e o recurso HTTP bloqueado. Peça validação da publicação e das URLs ao responsável, sem desabilitar a proteção do navegador.', ['KB-0026']),
    certificateEnd:end('Solicitar análise do certificado','Registre host, mensagem e horário. Encaminhe ao responsável por certificados/publicação, sem ignorar o alerta de segurança.', ['KB-0026']),
    frontendEnd:end('Encaminhar evidências da tela','Reúna erro JavaScript com contexto, versão, componente, resultado de janela anônima e chamada relacionada. Encaminhe à equipe da aplicação sem concluir que o problema é apenas do navegador.', ['KB-0002','KB-0007','KB-0017']),
    updateEnd:end('Validar a aplicação da correção','Documente pacote/versão e divergência de instância ou projeto. Peça ao responsável que valide a orientação do ticket e o procedimento previsto para o ambiente antes de qualquer nova aplicação.', ['KB-0024','KB-0022'])
  };
  symptoms.push(
    {id:'progress',title:'Erro em tela ou programa Progress',description:'Mensagem, execução Desktop/web e simulação do problema.',start:'execution'},
    {id:'simulation',title:'Montar uma simulação',description:'Pré-requisitos, passos e reprodução do comportamento.',start:'simulation'},
    {id:'noMessage',title:'Resultado incorreto sem mensagem',description:'Separar apresentação, processamento e dados.',start:'noMessage'},
    {id:'functional',title:'Resultado funcional divergente',description:'Rastrear um exemplo e validar a regra esperada.',start:'functionalRule'},
    {id:'missingRecord',title:'Registro não gerado / SPED',description:'Conferir regra, origem, seleção e arquivo gerado.',start:'recordScope'},
    {id:'calculation',title:'Cálculo diferente do esperado',description:'Comparar entradas, regra e memória de cálculo.',start:'calcInputs'}
  );
  Object.assign(nodes,{
    execution:step('Identifique onde o programa é executado','Registre programa, versão, usuário/perfil e ambiente. Confirme onde ocorre a execução: cliente Desktop, aplicação web ou serviço. Não presuma que toda execução Progress passa pelo PASOE.', ['KB-0030','KB-0016'],[

    rpwQueue:step('Confira destino e programação com o responsável','Confirme servidor RPW de destino, programação/horário e situação da solicitação. Registre o identificador e o que aparece no acompanhamento. Não altere fila, agendamento ou serviço por tentativa. Se há impedimento de execução, combine a verificação com o responsável pelo RPW.', ['KB-0035'],[
      option('A execução avançou; vou conferir seu estado','rpwState'),option('Identifiquei divergência no destino ou na programação','rpwQueueEnd'),option('Não há explicação no acompanhamento; preciso dos registros do RPW','rpwLog')],'rpwPendingEnd'),
    rpwSlow:step('Registre a demora e o alcance no RPW','Anote início, tempo observado, parâmetros/volume e se outros relatórios também foram afetados. Verifique se a execução continua ativa ou terminou. Não reenvie sem confirmar a tentativa anterior; a repetição pode gerar saídas ou efeitos duplicados. Se o impacto for crítico, combine a atuação com o responsável pelo RPW.', ['KB-0035'],[
      option('A execução terminou; vou conferir a saída','rpwOutput'),option('Permanece lenta ou parada; preciso analisar os registros do RPW','rpwLog')],'rpwPendingEnd'),
    rpwOutput:step('Confira a saída da execução identificada','Localize o arquivo/resultado dessa execução e compare identificação, data, formato e destino esperados. Não conclua que o relatório não foi gerado apenas porque não apareceu na tela. Revise os dados antes de usar capturas ou trechos.', ['KB-0035','KB-0032'],[
      option('Saída disponível e resultado conforme o esperado','rpwSuccessEnd'),option('Arquivo disponível, mas vazio ou com conteúdo divergente','rpwData'),option('Não localizei a saída ou não consigo obtê-la','rpwOutputCheck')],'rpwPendingEnd'),
    rpwOutputCheck:step('Diferencie geração de acesso à saída','Com o responsável, confira se a execução produziu saída e qual é o destino configurado. Registre a mensagem de obtenção/acesso quando houver. Não altere permissões ou diretórios por tentativa.', ['KB-0035'],[
      option('O arquivo existe; há diferença de destino ou acesso','rpwOutputEnd'),option('Confirmei a execução sem saída esperada; preciso do log do RPW','rpwLog')],'rpwPendingEnd'),
    rpwData:step('Compare filtros e dados do relatório','Confira período, parâmetros, empresa/estabelecimento e dados que atendem aos critérios, conforme a regra validada do programa. Escolha um exemplo rastreável e compare esperado/observado. Saída vazia ou divergente não exige automaticamente um log de erro.', ['KB-0035','KB-0032','KB-0034'],[
      option('Identifiquei diferença de parâmetros ou dados','functionalAdjust'),option('Os parâmetros estão corretos; preciso rastrear a divergência funcional','functionalRule'),option('Existe também mensagem ou falha de processamento','rpwLog')],'functionalCollect'),
    rpwLog:step('Solicite o log no servidor RPW correto','Peça ao responsável o log do servidor RPW que processou a execução, com relatório, identificador quando disponível e horário/fuso. Solicite alguns minutos antes e depois, preservando a sequência. Nomes e caminhos dependem do ambiente. Não peça log PASOE nem do servidor das telas Progress como substituto do registro RPW.', ['KB-0035','KB-0014'],[
      option('Recebi o log do servidor RPW e intervalo correspondentes','rpwAnalyze'),option('Ainda preciso receber o log correto','rpwLogPendingEnd',{pending:true})],'rpwLogPendingEnd'),
    rpwAnalyze:step('Leia o log e relacione os achados à execução RPW','Use editor aprovado ou o analisador local como auxílio. Confira execução/programa, servidor, intervalo/fuso e mensagem/código com contexto. O analisador não reconhece todos os formatos; não conclua ausência de erro só pela lista automática. Registre linhas e o que foi conferido.', ['KB-0035','KB-0014'],[
      option('Há erro relacionado a objeto ausente ou antigo','rpwObject'),option('Encontrei outra mensagem correlacionada ao relatório','rpwEvidenceEnd'),option('Revisei o intervalo correto sem erro relacionado visível','rpwEvidenceEnd'),option('Ainda não consegui ler ou correlacionar os registros','rpwLogPendingEnd',{pending:true})],'rpwLogPendingEnd'),
    rpwObject:step('Confira objetos e PROPATH no servidor RPW','Com o responsável pelo RPW, valide localização/versão dos objetos, pacote aplicado e PROPATH da sessão/serviço que executou o relatório. Atualizar objetos no servidor web ou no servidor das telas Progress não comprova atualização no RPW. Não mova arquivos nem altere caminhos por tentativa.', ['KB-0035','KB-0018','KB-0022'],[
      option('Identifiquei divergência de objeto, pacote ou caminho no RPW','rpwObjectEnd'),option('Objetos/caminhos conferidos; a evidência de execução permanece','rpwEvidenceEnd')],'rpwPendingEnd'),
    rpwPendingEnd:end('Complete a identificação do teste RPW','Registre o que falta: servidor RPW, execução, parâmetros, horário ou estado/saída. Combine a conferência com o responsável por esse servidor, sem utilizar dados de outro ambiente como comprovação.', ['KB-0035']),
    rpwQueueEnd:end('Valide destino e programação da solicitação','Registre a diferença e combine a revisão com o responsável pelo RPW. Confirme a situação da tentativa anterior antes de repetir o processamento e depois verifique a saída.', ['KB-0035']),
    rpwOutputEnd:end('Valide a obtenção da saída','Registre a evidência de geração, destino esperado/observado e mensagem de acesso. Combine a verificação com o responsável, sem presumir erro de geração quando o arquivo existe.', ['KB-0035']),
    rpwSuccessEnd:end('Registre a validação do relatório','Documente execução, parâmetros e a conferência do resultado. A confirmação vale para o cenário testado; não afirma que todos os relatórios ou parâmetros foram validados.', ['KB-0035','KB-0029']),
    rpwLogPendingEnd:end('Coleta ou análise do log RPW pendente','Registre o arquivo/intervalo que falta ou o motivo de não conseguir analisar. Solicite o registro do servidor RPW correspondente; receber o arquivo não substitui a leitura e correlação.', ['KB-0035']),
    rpwObjectEnd:end('Valide a atualização no RPW com o responsável','Registre objeto, localização, pacote e PROPATH do RPW. Combine a revisão e reteste autorizado, sem supor que a aplicação em outro servidor atualiza este ambiente.', ['KB-0035','KB-0022']),
    rpwEvidenceEnd:end('Consolide as evidências da execução RPW','Registre relatório, parâmetros, servidor RPW, execução/horário, saída e o que foi encontrado no log. Se não houver erro visível, documente o escopo revisado e o próximo teste; não conclua ausência de problema. Separe fatos e hipóteses.', ['KB-0035','KB-0029'])
  });
  for(const id of ['rpwContext','rpwState','rpwQueue','rpwSlow','rpwOutput','rpwOutputCheck','rpwData','rpwAnalyze','rpwObject'])nodes[id].requireEvidence=true;
  for(const id of ['rpwLog','rpwLogPendingEnd'])nodes[id].requestTemplate=true;
  for(const id of ['rpwAnalyze','rpwLogPendingEnd'])nodes[id].analyzer=true;
  for(const id of ['execution','executionLog','layerLog'])nodes[id].choices.splice(nodes[id].choices.length-1,0,option('Relatório executado no servidor RPW','rpwContext',{runtime:'rpw'}));
  checks.push({id:'rpwContext',label:'Servidor RPW, execução e parâmetros',nodes:['rpwContext']},{id:'rpwState',label:'Estado e saída da execução RPW',nodes:['rpwState','rpwOutput']},{id:'rpwLogs',label:'Coleta do log no servidor RPW',nodes:['rpwLog']},{id:'rpwAnalysis',label:'Leitura e correlação do log RPW',nodes:['rpwAnalyze']},{id:'rpwObjects',label:'Objetos e PROPATH do RPW',nodes:['rpwObject']});
  return {version:'1.4',symptoms,nodes,checks};
})();
</script>
