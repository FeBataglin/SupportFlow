<script>
(() => {
  'use strict';
  const pages = {
    dashboard: {title:'Visão geral',icon:'▦'},
    knowledge: {title:'Base de conhecimento',icon:'▤',description:'Guias de testes e procedimentos de atendimento.'},
    logs: {title:'Analisador de logs',icon:'≋',description:'Análise local de erros, ocorrências e contexto.'},
    diagnostics: {title:'Diagnóstico assistido',icon:'⑂',description:'Roteiros de testes conforme o sintoma e os resultados observados.'},
    suggestions: {title:'Sugestões e dificuldades',icon:'✎',description:'Ideias de melhoria e assuntos que precisam de orientação.'},
    admin: {title:'Administração',icon:'⚙'}
  };
  let state = null, sequence = 0, preview = false, previousPage='',guideReturn='';
  const $ = id => document.getElementById(id);
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = value => { const d = new Date(value); return isNaN(d.getTime()) ? '—' : d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}); };
  function rpc(method,...args) {
    if(preview){
      if(!['getBootstrap','listGuides','getGuide','getGuideImage','listSuggestions','createSuggestion'].includes(method))return Promise.reject(new Error('Volte à visão de Administração para realizar esta ação.'));
      if(['getBootstrap','listGuides','listSuggestions'].includes(method))args[0]={...(args[0]||{}),preview:true};
      else if(method==='getGuide')args[1]={preview:true};
      else if(method==='getGuideImage')args[2]={preview:true};
    }
    const labels={saveGuide:'Salvando guia…',listGuides:'Pesquisando guias…',getGuide:'Carregando guia…',getGuideImage:'Carregando imagens…',uploadGuideImage:'Enviando imagem…',saveUser:'Salvando usuário…',createSuggestion:'Enviando sugestão…',updateSuggestion:'Atualizando sugestão…',listSuggestions:'Carregando sugestões…',deleteGuides:'Removendo guias…',publishGuides:'Publicando guias…',simplifyGuides:'Revisando guias…',importInitialGuides:'Importando guias…'};
    const finish=window.SupportFlowActivity?window.SupportFlowActivity.begin(labels[method]||'Processando…'):()=>{};
    return new Promise((resolve,reject) => {
      if (!window.google || !google.script || !google.script.run) return reject(new Error('Abra o aplicativo pela URL de teste do Google Apps Script. A validação de acesso precisa do servidor.'));
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
    }).finally(finish);
  }
  function heading(label,title,description) {
    return `<div class="page-heading"><div><h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ''}</div></div>`;
  }
  function empty(title,description) {
    return `<div class="empty"><div class="empty-icon" aria-hidden="true">▤</div><h3>${esc(title)}</h3><p>${esc(description)}</p></div>`;
  }
  function dashboard() {
    const cards = ['knowledge','logs','diagnostics','suggestions'].map(id => {
      const p = pages[id];
      return `<a href="#${id}" class="panel card" style="text-decoration:none;color:inherit"><div style="font-size:25px;color:var(--cyan);margin-bottom:18px" aria-hidden="true">${p.icon}</div><h3>${p.title}</h3><p>${p.description}</p><span class="card-link">${id === 'knowledge' ? 'Consultar guias' : id === 'logs' ? 'Analisar log' : id === 'suggestions' ? 'Enviar sugestão' : 'Iniciar diagnóstico'}<span>↗</span></span></a>`;
    }).join('');
    const recent = state.recentArticles.length ? `<div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoria</th><th>Atualização</th></tr></thead><tbody>${state.recentArticles.map(a => `<tr><td><a href="#knowledge/${encodeURIComponent(a.id)}" target="_self">${esc(a.title)}</a></td><td>${esc(a.category)}</td><td>${esc(date(a.updatedAt))}</td></tr>`).join('')}</tbody></table></div>` : empty('Nenhuma orientação publicada','Os guias publicados pela Administração aparecerão aqui.');
    $('content').innerHTML = heading('','Visão geral','') +
      `<section class="stats"><div class="stat"><span class="stat-label">Orientações publicadas</span><strong>${state.dashboard.publishedArticles}</strong></div><div class="stat"><span class="stat-label">Categorias cadastradas</span><strong>${state.dashboard.categories}</strong></div><div class="stat"><span class="stat-label">Versão</span><strong style="font-size:21px">${esc(state.version)}</strong><small>Em desenvolvimento</small></div></section>
      <div class="section-heading"><h2>Módulos</h2></div><section class="cards">${cards}</section><div class="section-heading"><h2>Orientações recentes</h2></div><section class="panel">${recent}</section>`;
  }
  async function admin(ticket) {
    $('content').innerHTML = heading('GESTÃO DO WORKSPACE','Administração','Gerencie perfis e bloqueios de acesso.') + '<div class="panel" style="margin-top:25px" role="status">Carregando usuários…</div>';
    try {
      const data = await rpc('getAdminData');
      if (ticket !== sequence) return;
      $('content').innerHTML = heading('GESTÃO DO WORKSPACE','Administração','Gerencie perfis e bloqueios de acesso.') +
        `<div class="notice" style="margin-top:25px">Contas dos domínios autorizados acessam o Atendimento sem cadastro. Use esta tela para conceder Administração ou bloquear uma conta.</div><section class="panel"><h2 style="font-size:17px">Usuários e perfis</h2><p style="font-size:.875rem;color:var(--muted)">O cadastro de atendentes é opcional. Cadastre administradores ou selecione Editar para alterar um perfil ou bloqueio.</p><form id="user-form" class="user-form"><label>E-mail corporativo<input id="user-email" type="email" maxlength="254" required placeholder="nome@dominio.com.br"></label><label>Perfil<select id="user-role"><option value="support">Atendimento</option><option value="admin">Administração</option></select></label><label class="check"><input id="user-active" type="checkbox" checked> Acesso ativo</label><button class="button" id="save-user" type="submit">Salvar usuário</button></form><div id="form-status" class="form-status" role="status"></div><div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody>${data.users.map((u,i) => `<tr><td>${esc(u.email)}</td><td>${u.role === 'admin' ? 'Administração' : 'Atendimento'}</td><td>${u.active ? 'Ativo' : 'Inativo'}</td><td><button class="text-button edit-user" data-index="${i}" aria-label="Editar ${esc(u.email)}">Editar</button></td></tr>`).join('')}</tbody></table></div></section><div class="section-heading"><h2 style="font-size:17px">Configuração</h2></div><section class="panel"><p style="font-size:.875rem">Persistência: Google Sheets · Versão ${esc(data.version)}</p><p style="font-size:.875rem;color:var(--muted)">Analisador de logs local, sem envio de conteúdo ao servidor. Domínios e planilha são definidos nas propriedades do script pelo responsável técnico.</p></section><div class="section-heading"><h2 style="font-size:17px">Auditoria administrativa</h2><small>Até 50 eventos recentes</small></div><section class="panel"><p style="font-size:.875rem;color:var(--muted)">Registros de operações solicitadas. Um evento não comprova a conclusão da gravação subsequente.</p><div class="table-wrap"><table><thead><tr><th>Data</th><th>Responsável</th><th>Operação</th><th>Detalhes</th></tr></thead><tbody>${data.audit.map(a => `<tr><td>${esc(date(a.createdAt))}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div></section>`;
      document.querySelectorAll('.edit-user').forEach(button => button.addEventListener('click',() => {
        const user = data.users[Number(button.dataset.index)];
        $('user-email').value = user.email; $('user-role').value = user.role; $('user-active').checked = user.active; $('user-email').focus();
      }));
      $('user-form').addEventListener('submit',async event => {
        event.preventDefault();
        const button = $('save-user'), status = $('form-status');
        button.disabled = true; status.textContent = 'Salvando…';
        try {
          await rpc('saveUser',{email:$('user-email').value,role:$('user-role').value,active:$('user-active').checked});
          await load();
          $('notification').textContent = 'Usuário salvo.';
          setTimeout(() => { $('notification').textContent = ''; },4000);
        } catch (error) { status.textContent = error.message || String(error); }
        finally { button.disabled = false; }
      });
    } catch (error) { if (ticket === sequence) showError(error); }
  }
  function showError(error) {
    $('content').innerHTML = `<div class="status-panel"><div class="empty-icon" aria-hidden="true">◇</div><h1>Não foi possível continuar</h1><p>${esc(error.message || String(error))}</p><button class="button" id="retry">Tentar novamente</button></div>`;
    $('retry').addEventListener('click',load);
  }
  function render() {
    if (!state) return;
    const ticket = ++sequence;
    const route = location.hash.slice(1).split('/');
    let id = route[0] || 'dashboard';
    if (!Object.hasOwn(pages,id) || (id === 'admin' && state.user.role !== 'admin')) id = 'dashboard';
    $('breadcrumb').textContent = pages[id].title;
    document.querySelectorAll('.nav-link').forEach(a => { const active = a.dataset.page === id; a.classList.toggle('active',active); if(active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    document.body.classList.remove('menu-open'); $('menu-toggle').setAttribute('aria-expanded','false');
    if (id === 'dashboard') dashboard();
    else if (id === 'admin') admin(ticket);
    else if (id === 'knowledge') {
      if(previousPage==='diagnostics')guideReturn='diagnostics';
      else if(previousPage!=='knowledge')guideReturn='';
      let code;
      try {code = route[1] ? decodeURIComponent(route[1]) : '';} catch (_) {code = '__invalid__';}
      window.SupportFlowKnowledge.render({rpc,user:state.user,content:$('content'),isCurrent:() => ticket === sequence,onChange:load,id:code,returnTo:guideReturn});
    } else if (id === 'logs') window.SupportFlowLogs.render({rpc,user:state.user,content:$('content'),isCurrent:() => ticket === sequence});
    else if (id === 'diagnostics') window.SupportFlowDiagnostics.render({content:$('content'),isCurrent:() => ticket === sequence});
    else if (id === 'suggestions') window.SupportFlowSuggestions.render({rpc,user:state.user,content:$('content'),isCurrent:() => ticket === sequence});
    previousPage=id;

  }
  async function load() {
    const loadTicket=++sequence; state = null; $('navigation').innerHTML = '';$('user-preview-toggle').disabled=true;
    $('identity-name').textContent = 'Conectando…'; $('identity-role').textContent = 'Validando acesso';
    $('content').innerHTML = '<div class="status-panel" role="status"><span class="loader"></span><p>Validando acesso e carregando o workspace…</p></div>';
    try {
      const bootstrap=await rpc('getBootstrap');if(loadTicket!==sequence)return;state=bootstrap;
      const canPreview=state.user.canPreview===true||state.user.role==='admin';
      $('user-preview-toggle').hidden=!canPreview;
      $('user-preview-toggle').textContent=preview?'Voltar à Administração':'Ver como Atendimento';
      $('user-preview-toggle').disabled=false;
      $('user-preview-banner').hidden=!(preview&&canPreview);
      $('identity-name').textContent = state.user.email; $('identity-name').title = state.user.email;
      $('identity-role').textContent = preview&&canPreview?'Atendimento (prévia)':state.user.role === 'admin' ? 'Administração' : 'Atendimento';
      $('avatar').textContent = state.user.email.slice(0,2).toUpperCase();
      $('navigation').innerHTML = Object.entries(pages).filter(([id]) => id !== 'admin' || state.user.role === 'admin').map(([id,p]) => `<a class="nav-link" data-page="${id}" href="#${id}"><span class="nav-icon" aria-hidden="true">${p.icon}</span>${p.title}</a>`).join('');
      render();
    } catch (error) {if(loadTicket!==sequence)return;state = null;$('user-preview-toggle').disabled=false; $('identity-name').textContent = 'Acesso indisponível'; $('identity-role').textContent = 'Verifique a configuração'; showError(error); }
  }
  let theme = 'light';
  $('user-preview-toggle').addEventListener('click',()=>{if(state&&!(state.user.canPreview||state.user.role==='admin'))return;preview=!preview;load();});
  try { theme = localStorage.getItem('supportflow-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (_) {}
  document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
  $('theme-toggle').addEventListener('click',() => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try {localStorage.setItem('supportflow-theme',next);} catch (_) {} });
  $('menu-toggle').addEventListener('click',() => { const open = document.body.classList.toggle('menu-open'); $('menu-toggle').setAttribute('aria-expanded',String(open)); });
  window.addEventListener('hashchange',render);
  // Links de rota são tratados aqui para não navegar o iframe ou a janela
  // principal do Apps Script por causa de <base target="_top">.
  document.addEventListener('click',event => {
    if (event.defaultPrevented || event.button !== 0) return;
    const link = event.target.closest('a[href]');
    if (!link) return;
    const route = link.getAttribute('href');
    if (!route || !route.startsWith('#')) return;
    event.preventDefault();
    if (location.hash === route) render();
    else location.hash = route;
  });
  window.addEventListener('keydown',event => { if(event.key === 'Escape') {document.body.classList.remove('menu-open'); $('menu-toggle').setAttribute('aria-expanded','false');} });
  load();
})();
</script>
