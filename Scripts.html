<script>
(() => {
  'use strict';
  const pages = {
    dashboard: {title:'Visão geral',icon:'▦'},
    knowledge: {title:'Base de conhecimento',icon:'▤',version:'v1.1.0',description:'O conhecimento certo, no momento certo.',features:['Orientações organizadas por tecnologia e cenário','Pesquisa, categorias e publicação de artigos','Passos de teste e evidências esperadas']},
    diagnostics: {title:'Diagnóstico assistido',icon:'⑂',version:'v1.4.0',description:'Uma investigação estruturada, do sintoma às evidências.',features:['Roteiros com decisões e próximos passos','Registro de testes e resultados','Relatório para complementar o chamado']},
    logs: {title:'Analisador de logs',icon:'≋',version:'v1.2.0',description:'Transforme ocorrências em caminhos de investigação.',features:['Leitura local de arquivos TXT, LOG e HAR','Classificação, agrupamento e filtros','Padrões conhecidos e referência às linhas originais']},
    gemini: {title:'Assistente Gemini',icon:'✧',version:'v1.3.0',description:'Inteligência contextualizada para apoiar o atendimento.',features:['Respostas com referências às orientações publicadas','Separação entre evidências e hipóteses','Sugestão de testes e próximos passos']},
    history: {title:'Histórico',icon:'◷',version:'Versões futuras',description:'Acompanhe o caminho de cada investigação.',features:['Consulta de diagnósticos e metadados de análises','Visibilidade conforme perfil e permissões','Retenção definida pela política corporativa']},
    admin: {title:'Administração',icon:'⚙'}
  };
  let state = null, sequence = 0;
  const $ = id => document.getElementById(id);
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = value => { const d = new Date(value); return isNaN(d.getTime()) ? '—' : d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}); };
  function rpc(method,...args) {
    return new Promise((resolve,reject) => {
      if (!window.google || !google.script || !google.script.run) return reject(new Error('Abra o aplicativo pela URL de teste do Google Apps Script. A validação de acesso precisa do servidor.'));
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);
    });
  }
  function heading(label,title,description) {
    return `<div class="page-heading"><div><p style="font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700">${esc(label)}</p><h1 style="margin:8px 0 9px">${esc(title)}</h1><p style="color:var(--muted);font-size:13px;margin:0">${esc(description)}</p></div></div>`;
  }
  function empty(title,description) {
    return `<div class="empty"><div class="empty-icon" aria-hidden="true">▤</div><h3>${esc(title)}</h3><p>${esc(description)}</p></div>`;
  }
  function dashboard() {
    const cards = ['knowledge','diagnostics','logs','gemini'].map(id => {
      const p = pages[id];
      return `<a href="#${id}" class="panel card" style="text-decoration:none;color:inherit"><div style="font-size:25px;color:var(--cyan);margin-bottom:18px" aria-hidden="true">${p.icon}</div><h3>${p.title}</h3><p>${p.description}</p><span class="card-link">Planejado · ${p.version}<span>↗</span></span></a>`;
    }).join('');
    const recent = state.recentArticles.length ? `<div class="table-wrap"><table><thead><tr><th>Título</th><th>Categoria</th><th>Atualização</th></tr></thead><tbody>${state.recentArticles.map(a => `<tr><td>${esc(a.title)}</td><td>${esc(a.category)}</td><td>${esc(date(a.updatedAt))}</td></tr>`).join('')}</tbody></table></div>` : empty('Seu conhecimento começa aqui','Nenhuma orientação publicada. O cadastro e a consulta de artigos serão disponibilizados na v1.1.0.');
    $('content').innerHTML = heading('SEU WORKSPACE DE SUPORTE','Visão geral','Conhecimento, diagnóstico e inteligência em um só fluxo.') +
      `<section class="hero" style="margin-top:27px"><div><p class="eyebrow" style="font-size:10px;letter-spacing:1.5px">CONECTANDO CADA ETAPA DO ATENDIMENTO</p><h2>Mais clareza para investigar.<br>Mais confiança para orientar.</h2><p>Uma central para apoiar a jornada de suporte às aplicações web Datasul, da primeira análise ao encaminhamento técnico.</p></div><div class="hero-art" aria-hidden="true">⑂</div></section>
      <section class="stats" style="margin-top:22px"><div class="stat"><span class="stat-label">Orientações publicadas</span><strong>${state.dashboard.publishedArticles}</strong><small>Conteúdo cadastrado na base</small></div><div class="stat"><span class="stat-label">Categorias cadastradas</span><strong>${state.dashboard.categories}</strong><small>Organização do conhecimento</small></div><div class="stat"><span class="stat-label">Etapa do projeto</span><strong style="font-size:21px">Estrutura inicial</strong><small>v${esc(state.version)} · Em desenvolvimento</small></div></section>
      <div class="section-heading"><h2 style="font-size:17px;margin:0">Um fluxo, quatro pilares</h2><small>Módulos em evolução</small></div><section class="cards">${cards}</section><div class="section-heading"><h2 style="font-size:17px;margin:0">Orientações recentes</h2><small>Atualizações da base</small></div><section class="panel">${recent}</section>`;
  }
  function planned(id) {
    const p = pages[id];
    $('content').innerHTML = heading('MÓDULOS DO SUPPORTFLOW',p.title,p.description) + `<div class="notice" style="margin-top:27px"><strong>Planejado · ${esc(p.version)}</strong><br>Este módulo ainda não está disponível na v1.0.0. A navegação está pronta para sua implementação.</div><div class="planned-grid"><section class="panel"><h2 style="font-size:17px">O que está previsto</h2><ul class="feature-list">${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul><a href="#dashboard" class="button secondary">Voltar à visão geral</a></section><section class="panel">${empty(id === 'gemini' ? 'Integração desativada' : 'Em preparação',id === 'gemini' ? 'A conexão com IA depende da aprovação corporativa e da definição do serviço e da política de privacidade. Nenhum dado é enviado nesta versão.' : 'Os recursos serão disponibilizados nas próximas etapas, com validação dos procedimentos e permissões.')}</section></div>`;
  }
  async function admin(ticket) {
    $('content').innerHTML = heading('GESTÃO DO WORKSPACE','Administração','Controle quem pode acessar o SupportFlow.') + '<div class="panel" style="margin-top:25px" role="status">Carregando usuários…</div>';
    try {
      const data = await rpc('getAdminData');
      if (ticket !== sequence) return;
      $('content').innerHTML = heading('GESTÃO DO WORKSPACE','Administração','Controle quem pode acessar o SupportFlow.') +
        `<div class="notice" style="margin-top:25px">Acesso validado pelo servidor. Somente contas ativas dos domínios configurados podem utilizar o aplicativo.</div><section class="panel"><h2 style="font-size:17px">Usuários e perfis</h2><p style="font-size:12px;color:var(--muted)">Cadastre uma conta ou selecione Editar para atualizar o acesso.</p><form id="user-form" class="user-form"><label>E-mail corporativo<input id="user-email" type="email" maxlength="254" required placeholder="nome@dominio.com.br"></label><label>Perfil<select id="user-role"><option value="support">Atendimento</option><option value="admin">Administração</option></select></label><label class="check"><input id="user-active" type="checkbox" checked> Acesso ativo</label><button class="button" id="save-user" type="submit">Salvar usuário</button></form><div id="form-status" class="form-status" role="status"></div><div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody>${data.users.map((u,i) => `<tr><td>${esc(u.email)}</td><td>${u.role === 'admin' ? 'Administração' : 'Atendimento'}</td><td>${u.active ? 'Ativo' : 'Inativo'}</td><td><button class="text-button edit-user" data-index="${i}" aria-label="Editar ${esc(u.email)}">Editar</button></td></tr>`).join('')}</tbody></table></div></section><div class="section-heading"><h2 style="font-size:17px">Configuração</h2></div><section class="panel"><p style="font-size:13px">Persistência: Google Sheets · Versão ${esc(data.version)}</p><p style="font-size:12px;color:var(--muted)">Gemini desativado. Domínios e planilha são definidos nas propriedades do script pelo responsável técnico.</p></section><div class="section-heading"><h2 style="font-size:17px">Auditoria administrativa</h2><small>Até 50 eventos recentes</small></div><section class="panel"><p style="font-size:11px;color:var(--muted)">Registros de operações solicitadas. Um evento não comprova a conclusão da gravação subsequente.</p><div class="table-wrap"><table><thead><tr><th>Data</th><th>Responsável</th><th>Operação</th><th>Detalhes</th></tr></thead><tbody>${data.audit.map(a => `<tr><td>${esc(date(a.createdAt))}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div></section>`;
      document.querySelectorAll('.edit-user').forEach(button => button.addEventListener('click',() => {
        const user = data.users[Number(button.dataset.index)];
        $('user-email').value = user.email; $('user-role').value = user.role; $('user-active').checked = user.active; $('user-email').focus();
      }));
      $('user-form').addEventListener('submit',async event => {
        event.preventDefault();
        const button = $('save-user'), status = $('form-status');
        button.disabled = true; status.textContent = 'Salvando…';
        try {
          await rpc('saveUser',{email:$('user-email').value,role:$('user-role').value,active:$('user-active').checked});
          await load();
          $('notification').textContent = 'Usuário salvo.';
          setTimeout(() => { $('notification').textContent = ''; },4000);
        } catch (error) { status.textContent = error.message || String(error); }
        finally { button.disabled = false; }
      });
    } catch (error) { if (ticket === sequence) showError(error); }
  }
  function showError(error) {
    $('content').innerHTML = `<div class="status-panel"><div class="empty-icon" aria-hidden="true">◇</div><h1>Não foi possível continuar</h1><p>${esc(error.message || String(error))}</p><button class="button" id="retry">Tentar novamente</button></div>`;
    $('retry').addEventListener('click',load);
  }
  function render() {
    if (!state) return;
    const ticket = ++sequence;
    let id = location.hash.slice(1) || 'dashboard';
    if (!Object.hasOwn(pages,id) || (id === 'admin' && state.user.role !== 'admin')) id = 'dashboard';
    $('breadcrumb').textContent = pages[id].title;
    document.querySelectorAll('.nav-link').forEach(a => { const active = a.dataset.page === id; a.classList.toggle('active',active); if(active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    document.body.classList.remove('menu-open'); $('menu-toggle').setAttribute('aria-expanded','false');
    if (id === 'dashboard') dashboard(); else if (id === 'admin') admin(ticket); else planned(id);
  }
  async function load() {
    ++sequence; state = null; $('navigation').innerHTML = '';
    $('identity-name').textContent = 'Conectando…'; $('identity-role').textContent = 'Validando acesso';
    $('content').innerHTML = '<div class="status-panel" role="status"><span class="loader"></span><p>Validando acesso e carregando o workspace…</p></div>';
    try {
      state = await rpc('getBootstrap');
      $('identity-name').textContent = state.user.email; $('identity-name').title = state.user.email;
      $('identity-role').textContent = state.user.role === 'admin' ? 'Administração' : 'Atendimento';
      $('avatar').textContent = state.user.email.slice(0,2).toUpperCase();
      $('navigation').innerHTML = Object.entries(pages).filter(([id]) => id !== 'admin' || state.user.role === 'admin').map(([id,p]) => `<a class="nav-link" data-page="${id}" href="#${id}"><span class="nav-icon" aria-hidden="true">${p.icon}</span>${p.title}</a>`).join('');
      render();
    } catch (error) { state = null; $('identity-name').textContent = 'Acesso indisponível'; $('identity-role').textContent = 'Verifique a configuração'; showError(error); }
  }
  let theme = 'light';
  try { theme = localStorage.getItem('supportflow-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (_) {}
  document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
  $('theme-toggle').addEventListener('click',() => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try {localStorage.setItem('supportflow-theme',next);} catch (_) {} });
  $('menu-toggle').addEventListener('click',() => { const open = document.body.classList.toggle('menu-open'); $('menu-toggle').setAttribute('aria-expanded',String(open)); });
  window.addEventListener('hashchange',render);
  window.addEventListener('keydown',event => { if(event.key === 'Escape') {document.body.classList.remove('menu-open'); $('menu-toggle').setAttribute('aria-expanded','false');} });
  load();
})();
</script>
